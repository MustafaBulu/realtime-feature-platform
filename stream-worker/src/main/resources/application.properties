spring.application.name=stream-worker

server.port=8081

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=stream-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

rfp.kafka.events-topic=platform.events
rfp.rocksdb.path=./data/rocksdb/stream-worker
rfp.event-time.allowed-lateness=PT10M
rfp.dedup.retention=PT24H
rfp.dedup.cleanup-interval=PT5M
rfp.dedup.cleanup-batch-size=1000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.mustafabulu.realtimefeatureplatform=INFO
